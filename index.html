<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Plant Finder</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plant Finder">
  <meta name="theme-color" content="#2d5a0e">
  <meta name="description" content="Outlet plant location lookup for sales staff">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --g900:#1a3a07;--g800:#2d5a0e;--g700:#3B6D11;--g600:#4d8016;
      --g500:#639922;--g400:#7db52e;--g200:#C0DD97;--g100:#deefc4;--g50:#EAF3DE;
      --amber:#BA7517;--amber-light:#FAEEDA;--amber-border:#FAC775;
      --bg:#f5f7f2;--card:#ffffff;--border:rgba(0,0,0,0.10);
      --border-strong:rgba(0,0,0,0.18);--text:#1a1f14;--text2:#4a5240;--text3:#7a8570;
      --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
    }
    @media(prefers-color-scheme:dark){
      :root{--bg:#111810;--card:#1c2618;--border:rgba(255,255,255,0.10);
        --border-strong:rgba(255,255,255,0.20);--text:#e8f0e0;--text2:#9ab882;
        --text3:#6a7e5a;--g50:#1c2618;--g100:#253320;--g200:#3a5030;
        --amber-light:#2a1f08;--amber-border:#5a3a10;}
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;overflow:hidden;background:var(--g800);}
    body{font-family:-apple-system,'SF Pro Text',sans-serif;color:var(--text);}
    #app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:430px;margin:0 auto;background:var(--bg);}
    .header{background:var(--g800);padding:calc(var(--safe-top) + 12px) 16px 12px;flex-shrink:0;}
    .header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
    .app-title{display:flex;align-items:center;gap:8px;}
    .app-title svg{width:28px;height:28px;}
    .app-title h1{font-size:20px;font-weight:700;color:#EAF3DE;letter-spacing:-0.3px;}
    .sync-pill{font-size:11px;color:var(--g200);background:rgba(192,221,151,0.15);border:0.5px solid rgba(192,221,151,0.3);border-radius:20px;padding:4px 9px;display:flex;align-items:center;gap:4px;cursor:pointer;}
    .sync-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;transition:background 0.3s;}
    .sync-dot.live{background:#7db52e;} .sync-dot.stale{background:#BA7517;} .sync-dot.offline{background:#888;}
    .search-wrap{position:relative;}
    .search-wrap svg.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:0.6;pointer-events:none;}
    #search{width:100%;padding:10px 36px 10px 34px;border-radius:10px;border:none;background:rgba(255,255,255,0.13);color:#EAF3DE;font-size:15px;outline:none;}
    #search::placeholder{color:rgba(192,221,151,0.55);}
    #search:focus{background:rgba(255,255,255,0.18);}
    .clear-x{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.15);border:none;color:#EAF3DE;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;display:none;align-items:center;justify-content:center;}
    .clear-x.vis{display:flex;}
    .tabs{display:flex;background:var(--card);border-bottom:0.5px solid var(--border);flex-shrink:0;}
    .tab{flex:1;padding:10px 4px 8px;border:none;background:none;font-size:11px;color:var(--text3);cursor:pointer;text-align:center;border-bottom:2.5px solid transparent;transition:color 0.15s,border-color 0.15s;}
    .tab.on{color:var(--g700);border-bottom-color:var(--g500);font-weight:600;}
    .tab svg{display:block;margin:0 auto 3px;}
    .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--safe-bottom) + 12px);}
    .slabel{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;padding:14px 14px 6px;}
    .type-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px 12px;}
    .type-btn{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:14px 12px 12px;cursor:pointer;text-align:left;transition:transform 0.12s,border-color 0.12s;}
    .type-btn:active{transform:scale(0.97);}
    .type-btn .tb-icon{width:36px;height:36px;border-radius:9px;background:var(--g50);display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
    .type-btn .tb-icon svg{width:20px;height:20px;color:var(--g700);}
    .type-btn .tb-name{font-size:14px;font-weight:600;color:var(--text);}
    .type-btn .tb-count{font-size:12px;color:var(--text3);margin-top:2px;}
    .plant-list{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;}
    .plant-card{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:13px;cursor:pointer;transition:transform 0.1s;}
    .plant-card:active{transform:scale(0.985);}
    .pc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
    .pc-name{font-size:15px;font-weight:600;color:var(--text);}
    .pc-sci{font-size:12px;color:var(--text3);font-style:italic;margin-top:2px;}
    .aisle-chip{background:var(--g50);color:var(--g700);border:0.5px solid var(--g200);border-radius:8px;padding:5px 11px;font-size:14px;font-weight:700;white-space:nowrap;flex-shrink:0;}
    .pc-tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
    .tag{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--bg);color:var(--text3);border:0.5px solid var(--border);}
    .tag.sun{background:var(--amber-light);color:var(--amber);border-color:var(--amber-border);}
    .detail{padding:12px 14px 24px;}
    .back-btn{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--g600);font-size:14px;cursor:pointer;padding:6px 0;margin-bottom:10px;font-weight:500;}
    .detail-hero{background:var(--g800);border-radius:16px;padding:18px;margin-bottom:16px;}
    .dh-name{font-size:22px;font-weight:700;color:#EAF3DE;letter-spacing:-0.3px;}
    .dh-sci{font-size:14px;color:var(--g200);font-style:italic;margin-top:3px;}
    .dh-type{display:inline-block;margin-top:10px;font-size:12px;font-weight:600;background:rgba(192,221,151,0.2);color:var(--g200);padding:4px 12px;border-radius:20px;}
    .loc-card{border:2px solid var(--g500);border-radius:14px;padding:18px;text-align:center;margin-bottom:16px;background:var(--card);}
    .loc-label{font-size:12px;color:var(--text3);font-weight:500;margin-bottom:4px;}
    .loc-aisle{font-size:44px;font-weight:800;color:var(--g700);line-height:1;letter-spacing:-2px;}
    .loc-section{font-size:15px;color:var(--g500);margin-top:4px;font-weight:500;}
    .detail-rows{background:var(--card);border-radius:12px;border:0.5px solid var(--border);overflow:hidden;}
    .drow{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-bottom:0.5px solid var(--border);font-size:14px;}
    .drow:last-child{border-bottom:none;}
    .drow-l{color:var(--text3);} .drow-v{font-weight:600;color:var(--text);}
    .genus-list{padding:0 12px 12px;display:flex;flex-direction:column;gap:6px;}
    .genus-btn{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;display:flex;justify-content:space-between;align-items:center;transition:transform 0.1s;}
    .genus-btn:active{transform:scale(0.985);}
    .gb-name{font-size:15px;font-weight:600;color:var(--text);font-style:italic;}
    .gb-sub{font-size:12px;color:var(--text3);margin-top:2px;}
    .gb-badge{font-size:12px;background:var(--bg);color:var(--text3);border:0.5px solid var(--border);border-radius:20px;padding:3px 10px;}
    .data-area{padding:14px;}
    .status-card{background:var(--card);border:0.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;}
    .sc-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--border);font-size:14px;}
    .sc-row:last-child{border-bottom:none;}
    .sc-label{color:var(--text3);}
    .sc-val{font-weight:600;color:var(--text);}
    .sc-val.green{color:var(--g600);}
    .sc-val.amber{color:var(--amber);}
    .sync-btn{width:100%;padding:13px;border-radius:12px;border:none;background:var(--g700);color:#EAF3DE;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px;}
    .sync-btn:active{transform:scale(0.98);}
    .sync-btn.spinning svg{animation:spin 1s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .info-box{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:14px;font-size:13px;color:var(--text2);line-height:1.7;}
    .info-box code{font-family:'SF Mono',monospace;font-size:11.5px;background:var(--bg);padding:2px 5px;border-radius:4px;color:var(--g600);}
    .info-box strong{color:var(--text);font-weight:600;}
    .empty{text-align:center;padding:50px 16px;}
    .empty svg{margin:0 auto 12px;display:block;opacity:0.35;}
    .empty p{font-size:15px;color:var(--text3);}
    .toast{position:fixed;bottom:calc(var(--safe-bottom) + 80px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--g900);color:#EAF3DE;font-size:14px;padding:10px 20px;border-radius:20px;opacity:0;transition:all 0.25s;pointer-events:none;white-space:nowrap;z-index:999;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .loading-overlay{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:50;}
    .spinner{width:36px;height:36px;border:3px solid var(--g200);border-top-color:var(--g700);border-radius:50%;animation:spin 0.8s linear infinite;}
    .loading-overlay p{font-size:14px;color:var(--text3);}
  </style>
</head>
<body>
<div id="app" style="position:relative;">
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <p>Loading plant data…</p>
  </div>
  <div class="header">
    <div class="header-row">
      <div class="app-title">
        <svg viewBox="0 0 28 28" fill="none">
          <path d="M14 24C14 24 6 18 6 11C6 7.13 9.13 4 13 4C13.67 4 14.33 4.09 14.96 4.26C13.77 5.37 13 6.9 13 8.5C13 11.54 15.46 14 18.5 14C19.84 14 21.06 13.52 22 12.72C21.99 12.81 22 12.9 22 13C22 18 14 24 14 24Z" fill="#7db52e"/>
          <path d="M22 8.5C22 11.54 19.54 14 16.5 14C13.46 14 11 11.54 11 8.5C11 5.46 13.46 3 16.5 3C19.54 3 22 5.46 22 8.5Z" fill="#4d8016"/>
        </svg>
        <h1>Plant Finder</h1>
      </div>
      <div class="sync-pill" id="sync-pill" onclick="manualSync()">
        <span class="sync-dot live" id="sync-dot"></span>
        <span id="sync-label">Checking…</span>
      </div>
    </div>
    <div class="search-wrap">
      <svg class="si" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#EAF3DE" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search" type="search" placeholder="Search plants, genus, type…" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="clear-x" id="clear-x" onclick="clearSearch()">✕</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab on" data-t="type" onclick="switchTab('type')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      By Type
    </button>
    <button class="tab" data-t="genus" onclick="switchTab('genus')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2v-4M9 21H5a2 2 0 0 1-2-2v-4m0 0h18"/></svg>
      By Genus
    </button>
    <button class="tab" data-t="all" onclick="switchTab('all')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      All Plants
    </button>
    <button class="tab" data-t="data" onclick="switchTab('data')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
      Data
    </button>
  </div>
  <div class="scroll" id="scroll"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONFIGURATION — update DATA_URL after deploying to GitHub
// ============================================================
const DATA_URL = 'https://kyleNatorp.github.io/plant-finder/plants.json';
// After deploying to GitHub Pages, change this to your full URL, e.g.:
// const DATA_URL = 'https://YOURUSERNAME.github.io/plant-finder/plants.json';
// ============================================================

const CACHE_KEY = 'plantfinder_plants_v1';
const SYNC_TS_KEY = 'plantfinder_sync_ts';
const SYNC_SRC_KEY = 'plantfinder_sync_src';

const TYPE_ICONS = {
  Perennial:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V12"/><path d="M12 12C12 12 8 9 8 5C8 3 10 2 12 2C14 2 16 3 16 5C16 9 12 12 12 12Z"/><path d="M12 12C12 12 7 12 5 9C4 7.5 5 6 6.5 6C9 6 12 9 12 12Z"/><path d="M12 12C12 12 17 12 19 9C20 7.5 19 6 17.5 6C15 6 12 9 12 12Z"/></svg>`,
  Annual:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2a7 7 0 0 1 7 7"/><path d="M5 12a7 7 0 0 1 7-7"/><path d="M12 22a7 7 0 0 1-7-7"/><path d="M19 12a7 7 0 0 1-7 7"/></svg>`,
  Shrub:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14c1.66 0 3-1.34 3-3s-1.34-3-3-3c-.18 0-.36.02-.53.05A5 5 0 0 0 7.07 11H7a3 3 0 0 0 0 6h10z"/><line x1="12" y1="17" x2="12" y2="22"/><line x1="9" y1="22" x2="15" y2="22"/></svg>`,
  Tree:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 22 20 2 20"/><line x1="12" y1="20" x2="12" y2="22"/></svg>`,
  Evergreen:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 20 17 4 17"/><polygon points="12 7 19 20 5 20"/><line x1="12" y1="20" x2="12" y2="22"/></svg>`,
  Grass:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22V10"/><path d="M12 10C12 5 16 3 17 7"/><path d="M12 14C12 9 8 7 7 11"/></svg>`,
  Vegetable:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/></svg>`,
  Herb:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 22c1.25-1.25 2.5-2.5 3.5-3.5"/><path d="M9.5 16.5c2-2 5.5-5 8.5-3.5"/><path d="M6 20c1-2 3-5 7-7"/><path d="M15 5c-2 2-4 6-2 9"/><path d="M11 9c-1-1-3-4-1-6 3-2 5 2 3 4"/></svg>`
};

let plants = [];
let tab = 'type', detail = null, filterType = null, filterGenus = null, searching = false;
let syncStatus = 'checking'; // live | stale | offline

const scroll = document.getElementById('scroll');
const searchEl = document.getElementById('search');
const clearX = document.getElementById('clear-x');
const syncDot = document.getElementById('sync-dot');
const syncLabel = document.getElementById('sync-label');
const loadingOverlay = document.getElementById('loading');

// ─── Data fetching ───────────────────────────────────────────
async function fetchPlants(forceRefresh = false) {
  // Try network first
  try {
    const url = DATA_URL + '?t=' + Date.now();
    const resp = await fetch(url, { cache: 'no-cache' });
    if (resp.ok) {
      const data = await resp.json();
      if (Array.isArray(data) && data.length > 0) {
        plants = data;
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        localStorage.setItem(SYNC_TS_KEY, Date.now().toString());
        localStorage.setItem(SYNC_SRC_KEY, 'network');
        setSyncStatus('live');
        return true;
      }
    }
  } catch(e) {}

  // Fall back to localStorage cache
  try {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
      plants = JSON.parse(cached);
      setSyncStatus('stale');
      return true;
    }
  } catch(e) {}

  setSyncStatus('offline');
  return false;
}

function setSyncStatus(status) {
  syncStatus = status;
  syncDot.className = 'sync-dot ' + status;
  const ts = localStorage.getItem(SYNC_TS_KEY);
  if (status === 'live') {
    const now = new Date();
    syncLabel.textContent = 'Live · ' + now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  } else if (status === 'stale' && ts) {
    const d = new Date(parseInt(ts));
    const today = new Date();
    syncLabel.textContent = d.toDateString() === today.toDateString()
      ? 'Cached · ' + d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})
      : 'Cached · ' + d.toLocaleDateString([],{month:'short',day:'numeric'});
  } else {
    syncLabel.textContent = 'Offline';
  }
}

async function manualSync() {
  syncLabel.textContent = 'Syncing…';
  const ok = await fetchPlants(true);
  if (ok) { showToast(syncStatus === 'live' ? '✓ Data refreshed' : '⚠ Using cached data'); renderTab(); }
  else { showToast('Could not reach data source'); }
}

// ─── Startup ─────────────────────────────────────────────────
async function init() {
  const ok = await fetchPlants();
  loadingOverlay.style.display = 'none';
  if (ok) { renderTab(); }
  else {
    scroll.innerHTML = `<div class="empty">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 9v4"/><circle cx="12" cy="17" r="1"/><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
      <p>No data available.<br>Connect to WiFi and tap the sync badge.</p>
    </div>`;
  }
}

// ─── UI ──────────────────────────────────────────────────────
searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim();
  clearX.classList.toggle('vis', q.length > 0);
  if (q.length > 0) { searching = true; detail = null; renderSearch(q); }
  else { searching = false; renderTab(); }
});

function clearSearch() {
  searchEl.value = ''; clearX.classList.remove('vis');
  searching = false; detail = null; renderTab();
}

function switchTab(t) {
  if (searching) return;
  tab = t; detail = null; filterType = null; filterGenus = null;
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('on', el.dataset.t === t));
  renderTab();
}

function renderTab() {
  if (detail !== null) { renderDetail(detail); return; }
  if (tab === 'type') renderTypeTab();
  else if (tab === 'genus') renderGenusTab();
  else if (tab === 'all') renderList([...plants].sort((a,b)=>a.common.localeCompare(b.common)),'All plants',true);
  else renderDataTab();
}

function renderTypeTab() {
  if (filterType) { renderList(plants.filter(p=>p.type===filterType), filterType); return; }
  const types = [...new Set(plants.map(p=>p.type))].sort();
  let h = '<div class="slabel">Plant types</div><div class="type-grid">';
  types.forEach(t => {
    const n = plants.filter(p=>p.type===t).length;
    const icon = TYPE_ICONS[t] || TYPE_ICONS.Herb;
    h += `<button class="type-btn" onclick="filterType='${t}';renderTab()">
      <div class="tb-icon">${icon}</div>
      <div class="tb-name">${t}</div>
      <div class="tb-count">${n} plant${n!==1?'s':''}</div>
    </button>`;
  });
  scroll.innerHTML = h + '</div>';
}

function renderGenusTab() {
  if (filterGenus) { renderList(plants.filter(p=>p.genus===filterGenus), filterGenus); return; }
  const genera = [...new Set(plants.map(p=>p.genus))].sort();
  let h = '<div class="slabel">Genera — A to Z</div><div class="genus-list">';
  genera.forEach(g => {
    const n = plants.filter(p=>p.genus===g).length;
    const ex = plants.find(p=>p.genus===g);
    h += `<button class="genus-btn" onclick="filterGenus='${g}';renderTab()">
      <div><div class="gb-name">${g}</div><div class="gb-sub">${ex.type}</div></div>
      <span class="gb-badge">${n} var.</span>
    </button>`;
  });
  scroll.innerHTML = h + '</div>';
}

function renderList(list, title, noBack=false) {
  let h = `<div class="slabel" style="display:flex;align-items:center;gap:8px;">`;
  if (!noBack) h += `<button onclick="filterType=null;filterGenus=null;renderTab()" style="background:none;border:none;color:var(--g600);font-size:22px;cursor:pointer;padding:0;line-height:1;margin-right:2px;">‹</button>`;
  h += `${title}</div><div class="plant-list">`;
  if (!list.length) h += emptyState('No plants found');
  else list.forEach(p => { h += plantCard(p); });
  scroll.innerHTML = h + '</div>';
  scroll.querySelectorAll('.plant-card').forEach((el, i) => {
    el.addEventListener('click', () => showDetail(list[i].id));
  });
}

function plantCard(p) {
  return `<div class="plant-card">
    <div class="pc-top">
      <div><div class="pc-name">${p.common}</div><div class="pc-sci">${p.genus} ${p.species}</div></div>
      <span class="aisle-chip">Aisle ${p.aisle}</span>
    </div>
    <div class="pc-tags">
      <span class="tag">${p.type}</span>
      <span class="tag sun">☀ ${p.sun}</span>
      <span class="tag">§ ${p.section}</span>
    </div>
  </div>`;
}

function showDetail(id) { detail = id; renderDetail(id); }

function renderDetail(id) {
  const p = plants.find(x=>x.id===id);
  if (!p) return;
  scroll.innerHTML = `<div class="detail">
    <button class="back-btn" onclick="detail=null;renderTab()">‹ Back</button>
    <div class="detail-hero">
      <div class="dh-name">${p.common}</div>
      <div class="dh-sci">${p.genus} ${p.species}</div>
      <span class="dh-type">${p.type}</span>
    </div>
    <div class="loc-card">
      <div class="loc-label">Location in store</div>
      <div class="loc-aisle">Aisle ${p.aisle}</div>
      <div class="loc-section">Section ${p.section}</div>
    </div>
    <div class="detail-rows">
      <div class="drow"><span class="drow-l">Sun</span><span class="drow-v">${p.sun}</span></div>
      <div class="drow"><span class="drow-l">Water</span><span class="drow-v">${p.water}</span></div>
      <div class="drow"><span class="drow-l">Mature size</span><span class="drow-v">${p.size}</span></div>
      <div class="drow"><span class="drow-l">Bloom time</span><span class="drow-v">${p.bloom}</span></div>
    </div>
  </div>`;
}

function renderSearch(q) {
  const ql = q.toLowerCase();
  const results = plants.filter(p =>
    p.common.toLowerCase().includes(ql)||p.genus.toLowerCase().includes(ql)||
    p.species.toLowerCase().includes(ql)||p.type.toLowerCase().includes(ql)||
    p.aisle.toLowerCase().includes(ql)
  );
  let h = `<div class="slabel">${results.length} result${results.length!==1?'s':''} for "${q}"</div><div class="plant-list">`;
  if (!results.length) h += emptyState('No plants match');
  else results.forEach(p => { h += plantCard(p); });
  scroll.innerHTML = h + '</div>';
  scroll.querySelectorAll('.plant-card').forEach((el, i) => {
    el.addEventListener('click', () => showDetail(results[i].id));
  });
}

function renderDataTab() {
  const ts = localStorage.getItem(SYNC_TS_KEY);
  const src = localStorage.getItem(SYNC_SRC_KEY) || 'unknown';
  const tsStr = ts ? new Date(parseInt(ts)).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : 'Never';
  const statusColor = syncStatus === 'live' ? 'green' : syncStatus === 'stale' ? 'amber' : '';
  const statusText = syncStatus === 'live' ? 'Live — up to date' : syncStatus === 'stale' ? 'Cached data' : 'Offline';

  scroll.innerHTML = `<div class="data-area">
    <div class="status-card">
      <div class="sc-row"><span class="sc-label">Status</span><span class="sc-val ${statusColor}">${statusText}</span></div>
      <div class="sc-row"><span class="sc-label">Last synced</span><span class="sc-val">${tsStr}</span></div>
      <div class="sc-row"><span class="sc-label">Source</span><span class="sc-val">${src === 'network' ? 'plants.json (GitHub)' : 'Local cache'}</span></div>
      <div class="sc-row"><span class="sc-label">Plants loaded</span><span class="sc-val">${plants.length}</span></div>
    </div>
    <button class="sync-btn" id="sync-btn" onclick="triggerSync()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
      Sync now from GitHub
    </button>
    <div class="info-box">
      <strong>How auto-sync works:</strong><br>
      Each time this app opens, it fetches <code>plants.json</code> from GitHub Pages. Your IT team uploads a new file to GitHub and every phone gets updated automatically on next open — no manual import needed.<br><br>
      <strong>Data file location:</strong><br>
      <code>plants.json</code> — same folder as the app<br><br>
      <strong>JSON format:</strong><br>
      <code>[{"common":"...","genus":"...","aisle":"A","section":"1-3",...}]</code>
    </div>
  </div>`;
}

async function triggerSync() {
  const btn = document.getElementById('sync-btn');
  if (btn) { btn.classList.add('spinning'); btn.disabled = true; }
  await manualSync();
  renderDataTab();
}

function emptyState(msg) {
  return `<div class="empty"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>${msg}</p></div>`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

init();
</script>
</body>
</html>
